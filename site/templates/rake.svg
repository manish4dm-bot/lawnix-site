<svg class="rake" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rake-title">
  <title id="rake-title">Exploded drawing of the Lawnix LX-30 leveling rake</title>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e8e3"/><stop offset="0.5" stop-color="#b9bdb6"/><stop offset="1" stop-color="#8d928c"/>
    </linearGradient>
    <linearGradient id="steel-v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d928c"/><stop offset="0.5" stop-color="#e6e8e3"/><stop offset="1" stop-color="#9ea39d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(187,208,34,0.10)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect class="rake-grid" width="1000" height="620" fill="url(#grid)"/>

  <!-- ground line -->
  <line class="rake-ground" x1="40" y1="560" x2="960" y2="560" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- Part: plate (frame) -->
  <g class="part part-plate" data-label="30 x 10 inch plate, 304 stainless" data-home="0 0" data-start="0 90">
    <path d="M150 470 L850 470 L880 520 L180 520 Z" fill="url(#steel)" stroke="#f1f2ec" stroke-width="2"/>
    <path d="M150 470 L180 520 L180 548 L150 498 Z" fill="#a4a8a2" stroke="#f1f2ec" stroke-width="2"/>
    <path d="M850 470 L880 520 L880 548 L850 498 Z" fill="#7f847e" stroke="#f1f2ec" stroke-width="2"/>
    <path d="M180 520 L880 520 L880 548 L180 548 Z" fill="#6f746e" stroke="#f1f2ec" stroke-width="2"/>
  </g>

  <!-- Part: bars -->
  <g class="part part-bars" data-label="three parallel bars, spot welded" data-home="0 0" data-start="0 -120">
    <path d="M160 480 L840 480 L852 500 L172 500 Z" fill="url(#steel)" stroke="#f1f2ec" stroke-width="1.5"/>
    <path d="M166 496 L846 496 L858 514 L178 514 Z" fill="url(#steel)" stroke="#f1f2ec" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- Part: center mount -->
  <g class="part part-mount" data-label="center mount, anti-flip" data-home="0 0" data-start="60 -170">
    <path d="M470 430 L530 430 L548 470 L452 470 Z" fill="#c7cbc4" stroke="#f1f2ec" stroke-width="2"/>
    <rect x="486" y="400" width="28" height="34" rx="3" fill="url(#steel-v)" stroke="#f1f2ec" stroke-width="2"/>
    <circle cx="500" cy="452" r="5" fill="#0b0c0a" stroke="#f1f2ec" stroke-width="1.5"/>
  </g>

  <!-- Part: lower handle -->
  <g class="part part-handle1" data-label="lower handle section" data-home="0 0" data-start="110 -60">
    <line x1="500" y1="402" x2="590" y2="232" stroke="#f1f2ec" stroke-width="26" stroke-linecap="round"/>
    <line x1="500" y1="402" x2="590" y2="232" stroke="url(#steel-v)" stroke-width="22" stroke-linecap="round"/>
    <line x1="582" y1="247" x2="598" y2="217" stroke="#6f746e" stroke-width="30" stroke-linecap="butt" opacity="0.9"/>
  </g>

  <!-- Part: upper handle -->
  <g class="part part-handle2" data-label="upper handle, 78 inch total" data-home="0 0" data-start="150 -40">
    <line x1="590" y1="232" x2="676" y2="70" stroke="#f1f2ec" stroke-width="24" stroke-linecap="round"/>
    <line x1="590" y1="232" x2="676" y2="70" stroke="url(#steel-v)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Part: grip -->
  <g class="part part-grip" data-label="non-slip lime grip" data-home="0 0" data-start="190 -30">
    <line x1="672" y1="78" x2="708" y2="10" stroke="#0b0c0a" stroke-width="36" stroke-linecap="round"/>
    <line x1="672" y1="78" x2="708" y2="10" stroke="#bbd022" stroke-width="30" stroke-linecap="round"/>
    <path d="M676 56 L696 60 M682 44 L702 48 M688 32 L708 36 M694 20 L714 24" stroke="#0b0c0a" stroke-width="2.5" opacity="0.55" fill="none"/>
  </g>

  <!-- dimension lines (drawn in after assembly) -->
  <g class="dims" fill="none" stroke="#bbd022" stroke-width="1.5">
    <path class="dim" d="M150 590 L880 590 M150 580 L150 600 M880 580 L880 600"/>
    <path class="dim" d="M70 470 L70 548 M60 470 L80 470 M60 548 L80 548"/>
    <path class="dim" d="M930 548 L930 60 M920 548 L940 548 M920 60 L940 60"/>
  </g>
  <g class="dim-labels" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="22" font-weight="700" fill="#bbd022" text-anchor="middle">
    <text class="dim-label" x="515" y="614">30 IN PLATE</text>
    <text class="dim-label" x="46" y="515" transform="rotate(-90 46 515)">10 IN</text>
    <text class="dim-label" x="966" y="310" transform="rotate(90 966 310)">78 IN HANDLE</text>
  </g>
</svg>
