<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 682 2048" width="682" height="2048" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
  <defs>
    <style>
      .green{fill:#BED62C}
      .dark{fill:#131312}
      .light{fill:#FDFCFD}
      .white{fill:#ffffff}
    </style>
  </defs>

  <rect width="682" height="2048" fill="#FDFCFD"/>

  <!-- ============ LEFT PANEL (front of package) ============ -->
  <g>
    <!-- Body shape: rounded top + tapered black bottom -->
    <path class="green" d="M97,60 Q97,25 175,25 H209 Q287,25 287,60 V1700 L192,1735 L97,1700 Z"/>
    <!-- Black bottom section -->
    <path class="dark" d="M97,1000 L192,1033 L287,1000 V1978 Q287,2023 192,2023 Q97,2023 97,1978 Z"/>
    <!-- Bottom cap chevron -->
    <path class="dark" d="M97,1740 L192,1773 L287,1740 V1978 Q287,2023 192,2023 Q97,2023 97,1978 Z"/>
    <!-- Top cap -->
    <path class="dark" d="M97,60 Q97,25 175,25 H209 Q287,25 287,60 V90 L192,115 L97,90 Z"/>

    <!-- LAWNIX vertical wordmark (rotated) -->
    <g transform="translate(192,560) rotate(-90)">
      <text text-anchor="middle" font-size="115" font-weight="900" fill="#131312" letter-spacing="2">LAWNIX</text>
      <text text-anchor="middle" y="-78" font-size="22" font-weight="700" fill="#131312" letter-spacing="6">POWER · PRECISION · PERFORMANCE</text>
    </g>
    <!-- Small grass tuft below LAWNIX -->
    <g transform="translate(192,880)" fill="#131312">
